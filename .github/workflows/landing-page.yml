name: Deploy Landing Page

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_SERVER_SSH_KEY }}" > ~/.ssh/hk
          chmod 600 ~/.ssh/hk
          ssh-keyscan -H "${{ secrets.HK_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and restart nginx
        run: |
          scp -i ~/.ssh/hk public/index.html "${{ secrets.HK_SERVER_USER }}@${{ secrets.HK_SERVER_HOST }}:/tmp/index.html"

          ssh -i ~/.ssh/hk "${{ secrets.HK_SERVER_USER }}@${{ secrets.HK_SERVER_HOST }}" bash <<'EOF'
          set -euo pipefail

          # Move landing page to shared dir
          cp /tmp/index.html /var/www/adaiwiz/shared/index.html
          chmod 644 /var/www/adaiwiz/shared/index.html
          echo "Landing page deployed."

          # Nginx: 80 → 301 to HTTPS, 443 → landing page static files
          sudo tee /etc/nginx/sites-available/adaiwiz > /dev/null <<'NGINX'
          # HTTP — redirect all to HTTPS
          server {
              listen 80;
              server_name www.adaiwiz.com;
              return 301 https://www.adaiwiz.com$request_uri;
          }

          # HTTPS — landing page (static)
          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name www.adaiwiz.com;

              ssl_certificate /etc/letsencrypt/live/www.adaiwiz.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/www.adaiwiz.com/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;

              root /var/www/adaiwiz/shared;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~ /\.well-known/acme-challenge/ {
                  allow all;
              }
          }
          NGINX

          # Restart nginx
          sudo pkill -9 nginx || true
          sleep 1
          sudo nginx
          echo "Nginx restarted."

          # Verify
          echo "=== ports ==="
          sudo ss -ltnp | grep -E ':80|:443'
          echo ""
          echo "=== https test (landing page) ==="
          curl -sS --max-time 8 https://www.adaiwiz.com | head -5 || true
          echo ""
          echo "=== http test (should redirect) ==="
          curl -sS --max-time 8 -I http://www.adaiwiz.com 2>/dev/null | grep -E "HTTP|Location" || true
          EOF
