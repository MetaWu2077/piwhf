name: Diag2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_SERVER_SSH_KEY }}" > ~/.ssh/hk
          chmod 600 ~/.ssh/hk
          ssh-keyscan -H "${{ secrets.HK_SERVER_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hk "${{ secrets.HK_SERVER_USER }}@${{ secrets.HK_SERVER_HOST }}" bash <<'EOF'
          echo "=== 1. sites-enabled ==="
          ls -la /etc/nginx/sites-enabled/
          echo ""
          echo "=== 2. nginx.conf includes ==="
          grep -r "sites-available" /etc/nginx/nginx.conf || echo "no direct include"
          echo ""
          echo "=== 3. sites-available ==="
          ls -la /etc/nginx/sites-available/
          echo ""
          echo "=== 4. sites-available/adaiwiz-app content ==="
          cat /etc/nginx/sites-available/adaiwiz-app 2>/dev/null | head -5
          echo ""
          echo "=== 5. all nginx server_names on 443 ==="
          sudo ss -ltnp | grep ':443'
          echo ""
          echo "=== 6. current nginx full config (last 80 lines) ==="
          sudo nginx -T 2>&1 | tail -80
          EOF
