name: Diagnose HK server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_SERVER_SSH_KEY }}" > ~/.ssh/adaiwiz_hk
          chmod 600 ~/.ssh/adaiwiz_hk
          ssh-keyscan -H "${{ secrets.HK_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnose server
        run: |
          ssh -i ~/.ssh/adaiwiz_hk "${{ secrets.HK_SERVER_USER }}@${{ secrets.HK_SERVER_HOST }}" bash <<'DIAGNOSE'
          set -euo pipefail

          echo "============================================"
          echo "1. PM2 LIST"
          echo "============================================"
          pm2 list || true

          echo ""
          echo "============================================"
          echo "2. PM2 APP DETAILS"
          echo "============================================"
          pm2 describe adaiwiz 2>/dev/null | grep -E "name|version|status|port|env" || true
          pm2 env adaiwiz 2>/dev/null | grep -E "SHOPIFY_|NODE_ENV|PORT|DATABASE_URL" | head -20 || true

          echo ""
          echo "============================================"
          echo "3. CURRENT .env (safe vars only)"
          echo "============================================"
          ENV_FILE="/var/www/adaiwiz/shared/.env"
          if [ -f "$ENV_FILE" ]; then
            grep -E "^(SHOPIFY_API_KEY|SHOPIFY_APP_URL|SCOPES|NODE_ENV|PORT|DATABASE_URL)=" "$ENV_FILE" || echo "NOT FOUND"
            if grep -q "^SHOPIFY_API_SECRET=." "$ENV_FILE"; then
              echo "SHOPIFY_API_SECRET=<set, $(grep '^SHOPIFY_API_SECRET=' "$ENV_FILE" | cut -d= -f2 | wc -c) chars>"
            else
              echo "SHOPIFY_API_SECRET=<MISSING>"
            fi
          else
            echo "WARNING: $ENV_FILE does not exist!"
          fi

          echo ""
          echo "============================================"
          echo "4. CURRENTLY DEPLOYED APP"
          echo "============================================"
          APP_DIR="/var/www/adaiwiz"
          if [ -L "$APP_DIR/current" ]; then
            echo "current symlink -> $(readlink -f "$APP_DIR/current")"
            if [ -f "$APP_DIR/current/package.json" ]; then
              echo "package.json name: $(node -p "require('$APP_DIR/current/package.json').name")"
            fi
            if [ -f "$APP_DIR/current/.env" ]; then
              echo "local .env safe vars:"
              grep -E "^(SHOPIFY_API_KEY|SHOPIFY_APP_URL|SCOPES|NODE_ENV|PORT|DATABASE_URL)=" "$APP_DIR/current/.env" || echo "NOT FOUND"
            fi
          else
            echo "WARNING: $APP_DIR/current is not a symlink or does not exist"
          fi

          echo ""
          echo "============================================"
          echo "5. NGINX CONFIG"
          echo "============================================"
          NGINX_CONF=$(sudo nginx -T 2>&1 | grep -A50 "sites-available/adaiwiz" | head -60)
          if [ -n "$NGINX_CONF" ]; then
            echo "$NGINX_CONF"
          else
            echo "No adaiwiz site found in nginx config"
          fi

          echo ""
          echo "============================================"
          echo "6. PROCESSES ON PORT 80 / 3000"
          echo "============================================"
          sudo ss -ltnp | grep -E ':80|:3000|:443' || true

          echo ""
          echo "============================================"
          echo "7. RECENT PM2 LOGS"
          echo "============================================"
          pm2 logs adaiwiz --lines 30 --nostream 2>&1 | tail -40 || true

          echo ""
          echo "============================================"
          echo "8. LOCAL CURL TEST (no shop param)"
          echo "============================================"
          curl -sS --max-time 5 http://127.0.0.1:3000 2>&1 | head -5 || echo "CURL FAILED"

          echo ""
          echo "============================================"
          echo "9. ALL NGINX SITES-ENABLED"
          echo "============================================"
          ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
          for site in /etc/nginx/sites-enabled/*; do
            [ -e "$site" ] || continue
            echo "--- $site ($(readlink -f "$site")) ---"
            grep -E "server_name|listen|proxy_pass" "$site" 2>/dev/null || true
          done
          DIAGNOSE
